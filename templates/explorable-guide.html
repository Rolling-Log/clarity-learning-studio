<style>
:root{--ink:#292630;--muted:#716b7b;--accent:#6354a5;--soft:#edeaf5;--rule:#dedbe5;--paper:#fcfbfd}
html,body{padding:0;margin:0;background:transparent!important;color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif}*{box-sizing:border-box}#content{padding:0!important;overflow:hidden}button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,summary:focus-visible,.viewport:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.4;cursor:default}button{touch-action:manipulation}button:active{transform:none}button:hover{background:var(--soft)}
.exhibit{width:100%;padding:0 1px 4px}.source-pill{flex-shrink:0;border:1px solid var(--rule);border-radius:20px;padding:7px 11px;background:transparent;color:var(--accent);font-size:10px;white-space:nowrap;margin-top:3px}.viewport-wrap{position:relative;background:radial-gradient(ellipse at 50% 34%,#fff 0%,#f3f0f7 68%,#ece8f2);border:1px solid #e4dfea;border-radius:15px;overflow:hidden}.viewport{width:100%;height:clamp(325px,50vw,440px);position:relative;overflow:hidden;touch-action:none;cursor:grab}.is-expanded .viewport{height:clamp(360px,61vw,560px)}
@media(min-width:720px){.exhibit:not(.is-expanded) .viewport{height:clamp(284px,min(50vw,calc(var(--host-height,954px) - 514px)),440px)}}
.viewport:active{cursor:grabbing}
.viewport:focus-visible{outline-offset:-3px}.viewport>canvas,.viewport>.fallback-art{display:block;width:100%;height:100%}.viewport>canvas{position:absolute;inset:0}.figure-top{position:absolute;z-index:5;left:16px;right:16px;top:14px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;gap:8px}.segmented{display:inline-flex;border:1px solid #dcd5e6;background:#fcfbfdd9;border-radius:20px;padding:3px;gap:1px;pointer-events:auto}.segmented button{border:0;background:transparent;color:var(--muted);font-size:10px;padding:6px 11px;border-radius:20px}.segmented button[aria-pressed=true]{background:var(--accent);color:white}.figure-actions{display:flex;align-items:center;gap:6px;pointer-events:auto}.round-button{display:grid;place-items:center;width:33px;height:33px;padding:0;border:1px solid #dcd5e6;border-radius:9px;background:#fcfbfddd;color:var(--accent)}
.round-button svg{width:17px;height:17px}.hotspots{position:absolute;inset:0;pointer-events:none}.hotspot{position:absolute;display:grid;place-items:center;pointer-events:auto;border-radius:50%;width:26px;height:26px;padding:0;background:#fcfbfdec;border:1px solid var(--accent);color:var(--accent);font:10px/1 ui-monospace,monospace;transform:translate(-50%,-50%)!important;box-shadow:0 0 0 4px #fcfbfd99}.hotspot[aria-pressed=true]{color:white;background:var(--accent);box-shadow:0 0 0 5px #6354a51c}.hotspot:hover::after,.hotspot:focus-visible::after{content:attr(aria-label);position:absolute;left:50%;bottom:34px;transform:translateX(-50%);padding:5px 8px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font:10px "Segoe UI",sans-serif;white-space:nowrap;border-radius:6px}
.controls-area{margin-top:18px}.lab-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}.label-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:10px;gap:10px}.label-row output{color:var(--accent);font:11px ui-monospace,monospace}.range{display:block;width:100%;accent-color:var(--accent);height:14px;margin:0}.range-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:5px}.gears{display:flex;gap:5px}.gears button{flex:1;height:30px;border:1px solid var(--rule);border-radius:7px;background:transparent;font:10px ui-monospace,monospace}.gears button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:white}.metrics{display:flex;align-items:center;justify-content:space-around;gap:14px;border-left:1px solid var(--rule);padding:4px 12px 4px 22px;min-height:83px}.metric strong{font:400 28px/1 Georgia,serif;letter-spacing:-.04em;color:var(--accent);display:block;margin-bottom:7px}.metric small{font:9px/1.5 "Segoe UI",sans-serif;color:var(--muted)}.compact-control{margin-top:15px}.book-index{margin-top:18px;border-top:1px solid var(--rule);padding-top:14px}.book-index>summary{cursor:pointer;font-size:11px;color:var(--accent);list-style:none;display:flex;justify-content:space-between;align-items:center}.book-index>summary::after{content:'+';font-size:16px}.book-index[open]>summary::after{content:'−'}.section-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;margin-top:10px}.section-grid button{display:flex;gap:10px;align-items:baseline;text-align:left;border:0;border-bottom:1px solid #e8e3ee;background:transparent;padding:10px 2px;font-size:10px;line-height:1.5}.section-grid button span{font:9px ui-monospace,monospace;color:var(--accent);min-width:16px}.section-grid button[aria-pressed=true]{color:var(--accent);background:#edeaf560}.section-preview{font-size:11px;line-height:1.8;color:var(--muted);margin:13px 0 0}.section-preview button{border:0;background:none;color:var(--accent);padding:3px 6px;font-size:10px}.flatland-observation{position:absolute;z-index:3;right:16px;bottom:16px;width:164px;padding:12px 13px;background:#fcfbfde8;border:1px solid #e1dbea;border-radius:10px;pointer-events:none}.flatland-observation strong{font-size:10px;font-weight:500}.flatland-observation svg{width:100%;height:63px;display:block}.flatland-observation small{display:block;font-size:9px;color:var(--muted);line-height:1.4}.rule-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:15px}.rule-control{border:0;border-radius:7px;background:transparent;padding:7px 9px;min-height:34px;text-align:left;display:flex;align-items:center;gap:7px;min-width:0;color:var(--muted)}.rule-control[aria-pressed=true]{background:var(--soft);color:var(--ink)}.rule-control svg{width:17px;height:17px;flex-shrink:0;color:var(--accent)}.rule-control strong{font-size:12px;font-weight:600;display:block}.rule-switch{margin-left:auto;width:21px;height:13px;border-radius:15px;flex-shrink:0;background:#d5cede;position:relative}.rule-switch::after{content:'';position:absolute;width:9px;height:9px;top:2px;left:2px;border-radius:50%;background:white}.rule-control[aria-pressed=true] .rule-switch{background:var(--accent)}.rule-control[aria-pressed=true] .rule-switch::after{left:10px}.boids-lab{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:30px;align-items:center}.boids-metrics .metric strong{font-size:22px}.agent-legend{display:flex;gap:14px;font-size:9px;color:var(--muted);margin-top:11px}.agent-legend i{display:inline-block;width:6px;height:6px;background:#a398bd;border-radius:50%;margin-right:5px}.agent-legend .selected{background:#6354a5}.sim-notice{color:var(--muted);font-size:9px;margin-top:13px;line-height:1.6}
.source-pill,.segmented button{font-size:11px}.label-row,.label-row output{font-size:12px}
.metric small,.range-labels,.agent-legend{font-size:10px}
.section-grid button{font-size:12px;padding:10px 4px}
.section-grid button span[data-en]{font:inherit;color:inherit}
.section-grid button span:first-child{font-size:10px}
.section-preview,.book-index>summary{font-size:12px}
.flatland-observation strong{font-size:11px}
@media(max-width:700px){
 .lab-grid{gap:15px}.metrics{padding:13px;gap:9px}.metric strong{font-size:25px}
 .rule-control{padding:9px 7px;gap:6px}.rule-switch{display:none}
 .flatland-observation{width:140px}.figure-top{left:11px;right:11px}
 .segmented button{padding:6px 9px}
}
@media(max-width:430px){
 .lab-grid,.boids-lab,.section-grid{grid-template-columns:1fr}
 .metrics{border-left:0;border-top:1px solid var(--rule);padding:15px 0 0;min-height:0}
 .flatland-observation{right:10px;width:120px;padding:9px}
 .rule-control strong{font-size:11px}
 .figure-top{flex-wrap:wrap}
}
@media(max-width:560px){
 html,*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
 .viewport-wrap{--model-height:clamp(232px,66vw,326px)}
 .is-expanded .viewport-wrap{--model-height:clamp(294px,83vw,420px)}
 .exhibit .viewport{height:var(--model-height)}
 .hotspots{inset:auto 0 0;height:var(--model-height)}
 .hotspot::before{content:"";position:absolute;inset:-9px;border-radius:50%}
 .figure-top{position:relative;inset:auto;flex-wrap:wrap;gap:4px;padding:6px;background:#fcfbfdab;border-bottom:1px solid #e4dfea}
 .segmented{padding:2px}.segmented button{min-height:44px;min-width:44px;padding-inline:7px}
 .figure-actions{gap:3px;margin-left:auto}
 .round-button{width:44px;height:44px}
 .flatland-observation{right:8px;bottom:8px;width:105px;padding:7px}
 .flatland-observation strong{font-size:10px}
 .gears button,.rule-control,.section-grid button,.source-pill,#read-section{min-height:44px}
 .rule-control{justify-content:center;gap:4px}
 .rule-control svg{width:14px;height:14px;flex:none}
 .range{height:36px}
 .book-index>summary{display:flex;align-items:center;min-height:44px}
}
@media(max-width:340px){.rule-control svg{display:none}.gears{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}}
:root[data-theme=dark]{color-scheme:dark;--ink:#f3eff8;--muted:#b5abc4;--accent:#c1afff;--soft:#30263f;--rule:#4a4058;--paper:#231f2d;--solid:#6652a3}
[data-theme=dark] .viewport-wrap{background:radial-gradient(ellipse at 50% 34%,#41364f,#24202e 90%);border-color:var(--rule)}
[data-theme=dark] :is(.segmented,.round-button,.hotspot,.flatland-observation){background:var(--paper);border-color:var(--rule)}
[data-theme=dark] .hotspot{box-shadow:0 0 0 4px #221c2c85}
[data-theme=dark] :is(.segmented button,.hotspot,.gears button)[aria-pressed=true]{background:var(--solid);border-color:var(--accent);color:#fff}
[data-theme=dark] :is(.figure-top,.section-grid button){border-color:var(--rule)}
[data-theme=dark] .section-grid button[aria-pressed=true]{background:var(--soft)}
[data-theme=dark] .rule-switch{background:#61566f}
[data-theme=dark] .rule-control[aria-pressed=true] .rule-switch{background:var(--solid)}
[data-theme=dark] .agent-legend .selected{background:var(--accent)}
@media(max-width:560px){[data-theme=dark] .figure-top{background:var(--paper)}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
